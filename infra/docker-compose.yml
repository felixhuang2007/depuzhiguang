version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: depg
      POSTGRES_PASSWORD: depg_pass
      POSTGRES_DB: depg_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api-server:
    build:
      context: ../apps/api-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://depg:depg_pass@postgres:5432/depg_db
      JWT_SECRET: change-me-in-production
      NODE_ENV: production
    depends_on:
      - postgres
      - redis

  game-server:
    build:
      context: ../apps/game-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      API_BASE_URL: http://api-server:3000
      REDIS_URL: redis:6379
    depends_on:
      - api-server
      - redis

  bot-service:
    build:
      context: ../apps/bot-service
      dockerfile: Dockerfile
    environment:
      GAME_SERVER_WS: ws://game-server:8080/ws
      BOT_COUNT: 200
    depends_on:
      - game-server

volumes:
  pgdata:
