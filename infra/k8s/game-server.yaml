apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server
  namespace: depg
spec:
  replicas: 3
  selector:
    matchLabels:
      app: game-server
  template:
    metadata:
      labels:
        app: game-server
    spec:
      containers:
        - name: game-server
          image: depg/game-server:latest
          ports:
            - containerPort: 8080
          env:
            - name: API_BASE_URL
              value: http://api-server:3000
            - name: REDIS_URL
              value: redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: game-server
  namespace: depg
spec:
  selector:
    app: game-server
  ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-server
  namespace: depg
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: ws.depg.mn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: game-server
                port:
                  number: 8080
