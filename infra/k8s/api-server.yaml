apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: depg
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: depg/api-server:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: postgresql://depg@postgres:5432/depg_db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: depg-secrets
                  key: jwt-secret
            - name: NODE_ENV
              value: production
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: depg
spec:
  selector:
    app: api-server
  ports:
    - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-server
  namespace: depg
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: api.depg.mn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-server
                port:
                  number: 3000
