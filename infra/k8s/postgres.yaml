apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: depg
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: depg
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: depg-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: depg_db
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: depg
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
